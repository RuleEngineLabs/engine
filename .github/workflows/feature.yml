name: Feature — Validate & Open PR

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Go validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test + coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          TOTAL=$(grep 'total:' coverage.txt | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${TOTAL}%"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out

  open-pr:
    name: Open PR → develop
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PR to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          TITLE="feat: ${BRANCH#feature/}"
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$(cat <<'EOF'
          ## Automated PR

          Criado automaticamente pelo pipeline após validação em `${{ github.ref_name }}`.

          **CI passed:** go vet ✅ | tests ✅ | coverage ✅
          EOF
          )" || echo "PR already exists or base branch not found"
