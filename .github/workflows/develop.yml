name: Develop — Validate

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Go validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: Test + coverage
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
