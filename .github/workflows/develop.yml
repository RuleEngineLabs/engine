name: Develop — Validate

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: Go validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -short -race -count=1 ./cmd/admin/ ./internal/store/

      - name: Test + coverage gate (≥98%)
        run: |
          go test -short -count=1 -coverpkg=./internal/store/,./cmd/admin/ -coverprofile=coverage.out ./cmd/admin/ ./internal/store/
          go tool cover -func=coverage.out | tee coverage.txt
          TOTAL=$(grep 'total:' coverage.txt | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${TOTAL}%"
          awk -v t="$TOTAL" 'BEGIN { if (t+0 < 98.0) { print "Coverage " t "% is below the 98.0% gate"; exit 1 } }'
